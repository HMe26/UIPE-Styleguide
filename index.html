<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>UIPE Styleguide</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    /><link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <div class="top" dir="rtl">
      <div class="in">
        <div class="brand">
          <img class="logo" src="assets/uipe-logo.png" alt="UIPE" /><span
            >Styleguide</span
          >
        </div>
        <div class="seg" id="modes"></div>
        <div class="search">
          <input
            id="q"
            placeholder="ابحث: شاشة، مسار، لون، token، أيقونة…"
            autocomplete="off"
          /><kbd>/</kbd>
        </div>
        <button class="btn" id="themeBtn" title="تبديل الصفحة">◐</button>
      </div>
      <nav class="nav" id="nav"></nav>
    </div>
    <div class="wrap" id="main" dir="rtl"></div>
    <div class="lb" id="lb"></div>
    <div class="toast" id="toast"></div>
    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
