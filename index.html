<style>
:root{--bg:#F6F7FC;--surface:#fff;--text:#0F1424;--muted:#6B7089;--line:#E8EAF3;--primary:#515FFF;--on-primary:#fff;--sh:0 1px 2px rgba(15,20,36,.06),0 8px 24px rgba(15,20,36,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101420;--surface:#171E2E;--text:#F3F5FA;--muted:#8F9AB5;--line:#ffffff1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101420;--surface:#171E2E;--text:#F3F5FA;--muted:#8F9AB5;--line:#ffffff1a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Inter,Cairo,system-ui,sans-serif;transition:background .2s,color .2s}
button,input,select{font:inherit;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;direction:ltr;unicode-bidi:isolate}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1280px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em;margin-inline-end:6px}.brand b{color:var(--primary)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.search{flex:1;min-width:180px;max-width:360px;position:relative}
.search input{width:100%;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);outline:none}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
.search kbd{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);font:11px 'JetBrains Mono',monospace;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;pointer-events:none}
.nav{max-width:1280px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:4px;overflow-x:auto}
.nav a{padding:6px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--surface)}.nav a.on{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.wrap{max-width:1280px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px))}
.top{top:env(safe-area-inset-top,0px)}body::before{content:'';position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h2{font-size:20px;margin:30px 0 4px}h3{font-size:14px;margin:20px 0 8px}.sub{color:var(--muted);margin:0 0 14px;max-width:820px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--primary);color:var(--primary)}.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}.btn.pri:hover{color:var(--on-primary);filter:brightness(1.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.sw{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:start;padding:0;transition:transform .12s,box-shadow .12s}
.sw:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.sw i{display:block;height:64px;position:relative;background:repeating-conic-gradient(#d9dbe6 0 25%,#fff 0 50%) 0 0/12px 12px}.sw i b{position:absolute;inset:0}
.sw div{padding:8px 10px}.sw strong{display:block;font-size:12.5px;direction:ltr;text-align:start}.sw code{display:block;font:12px 'JetBrains Mono',monospace;color:var(--muted);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);font-size:13px}
.tbl th,.tbl td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}.tbl th{color:var(--muted);font-size:12px;position:sticky;top:0;background:var(--surface)}
.tbl tr.diff td.d{background:color-mix(in srgb,var(--primary) 12%,transparent);font-weight:700}
.scroll{overflow:auto;border-radius:14px;border:1px solid var(--line);max-height:640px}.scroll .tbl{border:0}
.cmp{display:flex;gap:3px}.cmp span{flex:1;height:26px;border-radius:6px;cursor:pointer;border:1px solid var(--line);min-width:46px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.shot .img{background:#0001;aspect-ratio:16/10;overflow:hidden;cursor:zoom-in;position:relative}
.shot .img img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .3s}.shot:hover .img img{transform:scale(1.03)}
.shot .img.m{aspect-ratio:16/10;display:flex;justify-content:center;background:linear-gradient(180deg,#0000,#0001)}.shot .img.m img{width:auto;height:100%;object-fit:contain}
.shot .meta{padding:12px 14px;display:flex;flex-direction:column;gap:8px}.shot h4{margin:0;font-size:15px}.shot p{margin:0;color:var(--muted);font-size:12.5px;direction:ltr;text-align:start}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.lb{position:fixed;inset:0;background:rgba(8,10,20,.95);z-index:50;display:none;flex-direction:column;padding:14px}.lb.on{display:flex}
.lb .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#fff;padding-bottom:10px}.lb .hd .btn{background:#ffffff18;border-color:#ffffff30;color:#fff}.lb .hd .chip{background:#ffffff14;border-color:#ffffff28;color:#fff}.lb .hd .chip.on{background:var(--primary)}
.lb .body{flex:1;overflow:auto;display:flex;gap:12px;justify-content:center;align-items:flex-start}.lb img{max-width:100%;border-radius:10px;display:block;cursor:zoom-in}.lb .body.fit img{max-height:100%;max-width:100%;object-fit:contain}.lb .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:center;color:#fff}.lb .body:not(.fit) img{max-width:none;width:1280px}.lb .body:not(.fit) .col{flex:none}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ic{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.12s}
.ic:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}.ic span{font:10.5px 'JetBrains Mono',monospace;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.ic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.demo{padding:22px;border-radius:18px;border:1px solid var(--line)}.dgrp{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.demo button.x{all:unset;box-sizing:border-box;cursor:pointer;font:700 14px Inter,Cairo;transition:filter .12s,transform .06s}.demo button.x:hover{filter:brightness(1.08)}.demo button.x:active{transform:scale(.97)}.demo button.x:focus-visible{outline:none;box-shadow:var(--ring)}
.demo.dis button.x,.demo.dis input{opacity:.45;pointer-events:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:#0F1424;color:#fff;padding:9px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw;direction:ltr}.toast.on{opacity:1;transform:translate(-50%,0)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.pad{height:14px;background:var(--primary);border-radius:3px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.cc{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:12px;align-items:stretch}@media(max-width:720px){.cc{grid-template-columns:1fr}.shots{grid-template-columns:1fr}}
.hero{display:flex;gap:18px;flex-wrap:wrap;margin:22px 0 4px;align-items:center}.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px}.stat b{font-size:22px;display:block;line-height:1.1}.stat span{color:var(--muted);font-size:12px}
</style>
<div class="top" dir="rtl"><div class="in">
 <div class="brand">UIPE <b>Styleguide</b></div>
 <div class="seg" id="modes"></div>
 <div class="search"><input id="q" placeholder="ابحث: لون، token، أيقونة، component…" autocomplete="off"><kbd>/</kbd></div>
 <button class="btn" id="themeBtn" title="تبديل الصفحة">◐</button>
</div><nav class="nav" id="nav"></nav></div>
<div class="wrap" id="main" dir="rtl"></div>
<div class="lb" id="lb"></div><div class="toast" id="toast"></div>
<script>
let M,ICONS,SCREENS,MODES;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let mode=store.get('uipe-sg-mode',(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark-classic':'classic');
let sec=(location.hash||'#screens').slice(1);let q='';let fmt=store.get('uipe-sg-fmt','hex');
const ST={cgroup:'all',compare:false,pf:'all',pm:'all',pl:'all',pd:'all',sz:28,tw:'UIPE Platform — منصة الجامعة',cfilter:'all',cdiff:false,dir:'ltr',dis:false,fg:'text/primary',bg:'bg/surface'};
const SECS=[['screens','الشاشات الحقيقية'],['colors','الألوان'],['type','الخطوط'],['space','المسافات والأبعاد'],['comps','Components'],['specs','Specs'],['icons','الأيقونات'],['export','تصدير']];
const smode=()=>mode.startsWith('dark')?'dark':mode;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const c=(n,m=mode)=>{const r=M.color_rows.find(r=>r.figma_name===n);return r?(r[m+'_css']||r[m+'_hex']):'transparent'};
const hexOf=(n,m=mode)=>{const r=M.color_rows.find(r=>r.figma_name===n);return r?(r[m+'_hex']||''):''};
const dispFont=m=>m.endsWith('classic')||m==='classic'?"'Playfair Display',Georgia,'Amiri',serif":"Inter,Cairo,sans-serif";
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1400)}
async function copy(t,label){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}toast('Copied '+(label||t).slice(0,60))}

const match=(...xs)=>!q||xs.some(x=>String(x).toLowerCase().includes(q));
const fmtColor=r=>({hex:r[mode+'_hex'],css:r[mode+'_css'],token:r.token,var:`var(${r.token})`,figma:r.figma_name}[fmt]);
const lum=h=>{const m=/^#?([\da-f]{6})/i.exec(h);if(!m)return null;const v=[0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)/255).map(x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2]};
const ratio=(a,b)=>{const x=lum(a),y=lum(b);if(x==null||y==null)return null;const [h,l]=x>y?[x,y]:[y,x];return(h+.05)/(l+.05)};

function applyTheme(){const rs=document.documentElement.style;const V={'--bg':'bg/canvas','--surface':'bg/surface','--text':'text/primary','--muted':'text/secondary','--line':'border/subtle','--primary':'color/primary'};
 for(const k in V)rs.setProperty(k,c(V[k]));rs.colorScheme=mode.startsWith('dark')?'dark':'light';rs.setProperty('--ring',M.shadows[mode]['focus ring (ui-ring)']||'none');
 $('#modes').innerHTML=MODES.map(m=>`<button class="${m===mode?'on':''}" data-m="${m}">${M.mode_label[m]}</button>`).join('');
 $$('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;store.set('uipe-sg-mode',mode);render()});
 $('#nav').innerHTML=SECS.map(([k,l])=>`<a href="#${k}" class="${k===sec?'on':''}">${l}</a>`).join('')}

/* ---------- Screens ---------- */
function screensView(){
 const all=SCREENS;const portals=[...new Set(all.map(g=>g.portal))];
 const f=(g)=>(ST.pf==='all'||g.portal===ST.pf)&&match(g.title,g.desc,g.portal,g.id);
 const vmatch=v=>(ST.pm==='all'||v.mode===ST.pm)&&(ST.pl==='all'||v.lang===ST.pl)&&(ST.pd==='all'||v.device===ST.pd);
 const groups=all.filter(f).map(g=>({...g,vs:g.variants.filter(vmatch)})).filter(g=>g.vs.length);
 const total=all.reduce((n,g)=>n+g.variants.length,0);
 const chips=(key,opts)=>`<div class="seg">`+opts.map(([v,l])=>`<button data-k="${key}" data-v="${v}" class="${ST[key]===v?'on':''}">${l}</button>`).join('')+`</div>`;
 let h=`<h2>الشاشات الحقيقية من المشروع</h2><p class="sub">لقطات من الـ React frontend نفسه (نفس الـ components والـ CSS والـ routes) في أوضاع وإعدادات مختلفة، بحالة بيانات فاضية (من غير باك-إند). دوس على أي صورة للتكبير، وجرّب المقارنة بين الأوضاع.</p>
 <div class="hero"><div class="stat"><b>${total}</b><span>لقطة</span></div><div class="stat"><b>${all.length}</b><span>شاشة</span></div><div class="stat"><b>3</b><span>أوضاع × AR/EN × موبايل</span></div></div>
 <div class="bar">${chips('pf',[['all','كل البوابات'],...portals.map(p=>[p,p])])}${chips('pm',[['all','كل الأوضاع'],['classic','Classic'],['light','Light'],['dark','Dark']])}${chips('pl',[['all','AR+EN'],['en','EN'],['ar','AR']])}${chips('pd',[['all','كل الأجهزة'],['desktop','Desktop'],['mobile','Mobile']])}</div>`;
 if(!groups.length)return h+'<div class="empty">مفيش نتائج بالفلاتر دي.</div>';
 h+='<div class="shots">'+groups.map(g=>{const sel=g.vs.find(v=>v.mode===smode()&&v.device==='desktop'&&(ST.pl==='all'?v.lang==='en':v.lang===ST.pl))||g.vs.find(v=>v.mode===smode())||g.vs[0];
  return `<article class="shot" data-g="${g.id}" data-sel="${sel.f}"><div class="img ${sel.device==='mobile'?'m':''}" data-open="${g.id}"><img loading="lazy" src="${sel.src}" alt="${esc(g.title)}"></div><div class="meta"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h4>${esc(g.title)}</h4><span class="tag">${g.portal}</span></div><p>${esc(g.desc)}</p><div class="bar" style="margin:0">${g.vs.map(v=>`<button class="chip ${v.f===sel.f?'on':''}" data-pick="${g.id}|${v.f}">${v.mode}·${v.lang}${v.device==='mobile'?'·📱':''}</button>`).join('')}</div></div></article>`}).join('')+'</div>';
 return h}
function bindScreens(){
 $$('[data-k]').forEach(b=>b.onclick=()=>{ST[b.dataset.k]=b.dataset.v;render()});
 $$('[data-pick]').forEach(b=>b.onclick=e=>{e.stopPropagation();const[g,f]=b.dataset.pick.split('|');const grp=SCREENS.find(x=>x.id===g),v=grp.variants.find(x=>x.f===f);const a=b.closest('.shot');a.dataset.sel=f;const im=a.querySelector('.img');im.classList.toggle('m',v.device==='mobile');im.querySelector('img').src=v.src;a.querySelectorAll('[data-pick]').forEach(x=>x.classList.toggle('on',x===b))});
 $$('[data-open]').forEach(e=>e.onclick=()=>openLb(e.dataset.open,e.closest('.shot').dataset.sel))}
let LB={g:null,f:null,cmp:false,fit:true};
function openLb(g,f){LB.g=g;LB.f=f;LB.cmp=false;drawLb();$('#lb').classList.add('on')}
function drawLb(){const g=SCREENS.find(x=>x.id===LB.g),v=g.variants.find(x=>x.f===LB.f)||g.variants[0];LB.f=v.f;
 const same=g.variants.filter(x=>x.device===v.device&&x.lang===v.lang);
 let body;if(LB.cmp&&same.length>1)body=same.map(x=>`<div class="col"><span class="tag">${x.mode}</span><img src="${x.src}" data-zoom></div>`).join('');else body=`<div class="col"><img src="${v.src}" data-zoom></div>`;
 const gi=SCREENS.indexOf(g);
 $('#lb').innerHTML=`<div class="hd"><strong style="font-size:15px">${esc(g.title)}</strong>${g.variants.map(x=>`<button class="chip ${x.f===v.f?'on':''}" data-lf="${x.f}">${x.mode}·${x.lang}${x.device==='mobile'?'·📱':''}</button>`).join('')}<span style="flex:1"></span>${same.length>1?`<button class="btn ${LB.cmp?'pri':''}" id="lbc">قارن الأوضاع (${same.length})</button>`:''}<button class="btn" id="lbf">${LB.fit?'حجم حقيقي':'ملاءمة الشاشة'}</button><button class="btn" id="lbp">‹</button><button class="btn" id="lbn">›</button><button class="btn" id="lbx">✕</button></div><div class="body ${LB.fit?'fit':''}">${body}</div>`;
 $$('#lb [data-lf]').forEach(b=>b.onclick=()=>{LB.f=b.dataset.lf;drawLb()});
 const t=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn};
 t('lbx',()=>$('#lb').classList.remove('on'));t('lbc',()=>{LB.cmp=!LB.cmp;drawLb()});t('lbf',()=>{LB.fit=!LB.fit;drawLb()});

 const step=d=>{const n=SCREENS[(gi+d+SCREENS.length)%SCREENS.length];LB.g=n.id;LB.f=n.variants[0].f;drawLb()};t('lbp',()=>step(-1));t('lbn',()=>step(1));
 $$('#lb [data-zoom]').forEach(i=>i.onclick=()=>{LB.fit=!LB.fit;drawLb()})}
document.addEventListener('keydown',e=>{const lb=$('#lb').classList.contains('on');if(lb){if(e.key==='Escape')$('#lb').classList.remove('on');if(e.key==='ArrowLeft')$('#lbn')?.click();if(e.key==='ArrowRight')$('#lbp')?.click();return}
 if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='/'){e.preventDefault();$('#q').focus()}if(/^[1-4]$/.test(e.key)){mode=MODES[+e.key-1];store.set('uipe-sg-mode',mode);render()}});

/* ---------- Colors ---------- */
function colorsView(){
 const groups=[...new Set(M.color_rows.map(r=>r.group))];const rows=M.color_rows.filter(r=>r[mode+'_hex']&&match(r.figma_name,r.token,r[mode+'_hex'],r.group));
 let h=`<h2>الألوان</h2><p class="sub">دوس على أي لون يتنسخ بالصيغة المختارة. فعّل «قارن الأوضاع» تشوف نفس الـ token في الأوضاع الأربعة، وجرّب فاحص التباين تحت.</p>
 <div class="bar"><div class="seg">${[['hex','HEX'],['css','rgb()'],['token','--token'],['var','var()'],['figma','Figma name']].map(([k,l])=>`<button data-fmt="${k}" class="${fmt===k?'on':''}">${l}</button>`).join('')}</div>
 <button class="chip ${ST.compare?'on':''}" id="cmpT">قارن الأوضاع</button><button class="chip ${ST.cdiff?'on':''}" id="diffT">اللي بيختلف بس</button>
 <select class="sel" id="cg"><option value="all">كل المجموعات</option>${groups.map(g=>`<option ${ST.cgroup===g?'selected':''} value="${esc(g)}">${esc(g)}</option>`).join('')}</select></div>`;
 const gs=groups.filter(g=>ST.cgroup==='all'||g===ST.cgroup);let any=false;
 if(ST.compare){const rr=M.color_rows.filter(r=>(ST.cgroup==='all'||r.group===ST.cgroup)&&match(r.figma_name,r.token,r.classic_hex,r.light_hex)&&(!ST.cdiff||new Set(MODES.map(m=>r[m+'_hex'])).size>1));
  h+=`<div class="scroll"><table class="tbl"><thead><tr><th>Token</th>${MODES.map(m=>`<th>${M.mode_label[m]}</th>`).join('')}</tr></thead><tbody>`+rr.map(r=>`<tr><td><strong class="ltr">${r.figma_name}</strong><div class="mono" style="color:var(--muted)">${r.token}</div></td>${MODES.map(m=>`<td><div class="cmp"><span data-cp="${r[m+'_hex']||''}" style="background:${r[m+'_css']||'transparent'}" title="${r[m+'_hex']||''}"></span></div><div class="mono">${r[m+'_hex']||'—'}</div></td>`).join('')}</tr>`).join('')+'</tbody></table></div>';any=rr.length>0}
 else for(const g of gs){const gr=rows.filter(r=>r.group===g&&(!ST.cdiff||new Set(MODES.map(m=>r[m+'_hex'])).size>1));if(!gr.length)continue;any=true;
  h+=`<h3>${esc(g)}</h3><div class="grid">`+gr.map(r=>`<button class="sw" data-cp="${esc(fmtColor(r))}"><i><b style="background:${r[mode+'_css']}"></b></i><div><strong>${r.figma_name}</strong><code>${r[mode+'_hex']}</code><code>${r.token}</code></div></button>`).join('')+'</div>'}
 if(!any)h+='<div class="empty">مفيش ألوان مطابقة.</div>';
 const sb=M.sidebar_bg[mode];const sbBg=sb.type==='gradient'?`linear-gradient(${sb.top},${sb.bottom})`:sb.color;
 h+=`<h3>Sidebar background</h3><div class="grid"><button class="sw" data-cp="${esc(sb.type==='gradient'?`linear-gradient(${sb.top}, ${sb.bottom})`:sb.color)}"><i><b style="background:${sbBg}"></b></i><div><strong>sidebar/background</strong><code>${sb.type==='gradient'?sb.top+' → '+sb.bottom:sb.color}</code></div></button></div>`;
 const names=M.color_rows.filter(r=>r[mode+'_hex']).map(r=>r.figma_name);
 const A=hexOf(ST.fg),B=hexOf(ST.bg),R=ratio(A,B);
 h+=`<h3>فاحص التباين (WCAG)</h3><div class="cc"><div class="box"><label>النص</label><br><select class="sel" id="fg" style="width:100%;margin-top:6px">${names.map(n=>`<option ${n===ST.fg?'selected':''}>${n}</option>`).join('')}</select></div><div class="box"><label>الخلفية</label><br><select class="sel" id="bg" style="width:100%;margin-top:6px">${names.map(n=>`<option ${n===ST.bg?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class="box" style="background:${c(ST.bg)};color:${c(ST.fg)};border-color:var(--line)"><div style="font:700 22px Inter,Cairo">Aa أبجد — ${R?R.toFixed(2)+':1':'n/a'}</div><div style="font-size:13px;margin-top:4px">${R?[['AA نص عادي',4.5],['AA نص كبير',3],['AAA',7]].map(([l,t])=>`${R>=t?'✓':'✗'} ${l}`).join(' · '):'لون بشفافية — مش قابل للحساب'}</div></div></div>`;
 return h}
function bindColors(){$$('[data-fmt]').forEach(b=>b.onclick=()=>{fmt=b.dataset.fmt;store.set('uipe-sg-fmt',fmt);render()});
 $$('[data-cp]').forEach(b=>b.onclick=()=>copy(b.dataset.cp));
 $('#cmpT').onclick=()=>{ST.compare=!ST.compare;render()};$('#diffT').onclick=()=>{ST.cdiff=!ST.cdiff;render()};$('#cg').onchange=e=>{ST.cgroup=e.target.value;render()};
 $('#fg').onchange=e=>{ST.fg=e.target.value;render()};$('#bg').onchange=e=>{ST.bg=e.target.value;render()}}

/* ---------- Typography ---------- */
function typeView(){let h=`<h2>Typography</h2><p class="sub">Headings: ${mode.endsWith('classic')?'Playfair Display (عربي: Amiri)':'Inter (عربي: Cairo)'} · Body: Inter / Cairo · Mono: JetBrains Mono. اكتب نص بنفسك واتحكم في الحجم.</p>
 <div class="bar"><input class="sel" id="tw" value="${esc(ST.tw)}" style="flex:1;min-width:220px"><label class="mono">size ×</label><input type="range" id="tsz" min="50" max="150" value="${ST.sz*3.57|0}" style="width:140px"><button class="chip ${ST.fluid?'on':''}" id="tmob">عرض الموبايل</button></div><div class="box">`;
 const k=ST.sz/28*(ST.mobile?1:1);
 h+=M.type_rows.filter(t=>match(t.style,t.note)).map(t=>{const px=(ST.mobile?t.size_mobile_px:t.size_desktop_px)*(ST.scale||1);return `<div style="display:flex;gap:18px;align-items:baseline;border-bottom:1px solid var(--line);padding:9px 0;flex-wrap:wrap"><div style="width:110px;color:var(--muted)">${t.style}</div><div style="flex:1;min-width:220px;font-family:${t.family==='display'?dispFont(mode):'Inter,Cairo,sans-serif'};font-weight:${t.weight};font-size:${px}px;line-height:1.2;overflow-wrap:anywhere">${esc(ST.tw)}</div><button class="chip mono" data-cp="font: ${t.weight} ${t.size_desktop_px}px/1.2 ${t.family==='display'?'display':'body'}">${t.size_mobile_px===t.size_desktop_px?t.size_desktop_px+'px':t.size_mobile_px+' → '+t.size_desktop_px+'px'} · w${t.weight}</button></div>`}).join('')+'</div>';return h}
function bindType(){$('#tw').oninput=e=>{ST.tw=e.target.value;const p=e.target.selectionStart;render();const n=$('#tw');n.focus();n.setSelectionRange(p,p)};$('#tsz').oninput=e=>{ST.scale=e.target.value/100;ST.sz=ST.scale*28;render();$('#tsz').focus()};$('#tmob').onclick=()=>{ST.mobile=!ST.mobile;render()};$$('[data-cp]').forEach(b=>b.onclick=()=>copy(b.dataset.cp))}

/* ---------- Spacing / radius / shadows / layout ---------- */
function spaceView(){const rd=M.radius[mode];
 let h=`<h2>المسافات والأبعاد</h2><p class="sub">دوس على أي قيمة تتنسخ. الـ radius والظلال بتتغير مع الوضع.</p><h3>Spacing</h3><div class="box">`+M.spacing.concat(M.ui_gaps).filter(([n])=>match(n)).map(([n,v])=>`<div data-cp="${n}: ${v}px" style="display:flex;gap:12px;align-items:center;margin:5px 0;cursor:pointer"><span class="mono" style="width:130px">${n}</span><div class="pad" style="width:${v*3}px"></div><span class="mono">${v}px</span></div>`).join('')+'</div>';
 h+=`<h3>Radius</h3><div class="row">`+Object.entries(rd).filter(([n])=>match(n)).map(([n,v])=>`<div data-cp="${n}: ${v}px" style="text-align:center;cursor:pointer"><div style="width:90px;height:70px;background:var(--surface);border:2px solid var(--primary);border-radius:${Math.min(v,35)}px"></div><div class="mono">${n}</div><div class="mono" style="color:var(--muted)">${v}px</div></div>`).join('')+'</div>';
 h+=`<h3>Shadows</h3><div class="row">`+Object.entries(M.shadows[mode]).filter(([n])=>match(n)).map(([n,v])=>`<div data-cp="box-shadow: ${esc(v)}" style="width:240px;cursor:pointer"><div class="shd" style="height:80px;border-radius:16px;background:var(--surface);box-shadow:${v};border:1px solid var(--line)"></div><div style="font-weight:600;margin-top:8px">${n}</div><div class="mono" style="color:var(--muted);word-break:break-word">${v}</div></div>`).join('')+'</div>';
 h+=`<h3>Layout</h3><div class="scroll"><table class="tbl"><tbody>`+M.layout.filter(([n])=>match(n)).map(([n,v])=>`<tr data-cp="${esc(n)}: ${v}px" style="cursor:pointer"><td>${n}</td><td class="mono">${v}</td></tr>`).join('')+`</tbody></table></div><h3>Breakpoints (max-width)</h3><div class="scroll"><table class="tbl"><tbody>`+M.breakpoints.filter(([n,v,t])=>match(n,v,t)).map(([n,v,t])=>`<tr data-cp="@media (max-width: ${v}px)" style="cursor:pointer"><td>${n}</td><td class="mono">${v}</td><td>${t}</td></tr>`).join('')+'</tbody></table></div>';return h}
const bindCp=()=>$$('[data-cp]').forEach(b=>b.onclick=()=>copy(b.dataset.cp));

/* ---------- Components ---------- */
function compsView(){const rd=M.radius[mode],P=c('color/primary');const dir=ST.dir;
 const btn=(bg,fg,b,t,pad='9.8px 18.2px')=>`<button class="x" style="padding:${pad};border-radius:${rd['radius-md']}px;background:${bg};color:${fg};${b?`border:1px solid ${b};`:''}">${t}</button>`;
 return `<h2>Components (Live)</h2><p class="sub">معاينة تفاعلية من نفس القيم: hover / active / focus شغالين. بدّل الاتجاه أو حالة الـ disabled.</p>
 <div class="bar"><div class="seg"><button data-dir="ltr" class="${dir==='ltr'?'on':''}">LTR</button><button data-dir="rtl" class="${dir==='rtl'?'on':''}">RTL</button></div><button class="chip ${ST.dis?'on':''}" id="disT">Disabled</button></div>
 <div class="demo ${ST.dis?'dis':''}" dir="${dir}" style="background:${c('bg/canvas')};color:${c('text/primary')}"><div class="dgrp">
 ${btn(P,'#fff','','Primary')}${btn(c('color/accent'),'#0F1424','','Accent')}${btn('transparent',c('text/primary'),c('border/subtle'),'Outline','8.8px 17.2px')}${btn('transparent',c('text/secondary'),'','Ghost')}
 <input placeholder="Input" style="padding:10px 14px;border-radius:${rd['radius-md']}px;border:1px solid ${c('border/subtle')};background:${c('bg/surface')};color:${c('text/primary')};font:14px Inter,Cairo" onfocus="this.style.boxShadow='${M.shadows[mode]['focus ring (ui-ring)']}';this.style.borderColor='${P}'" onblur="this.style.boxShadow='none';this.style.borderColor='${c('border/subtle')}'">
 ${[['success','Success'],['danger','Danger'],['warning','Warning'],['primary','Primary']].map(([k,l])=>`<span style="padding:2px 9px;border-radius:999px;font:700 11.5px Inter;background:${c('ui/tint-'+k)};color:${k==='primary'?P:c('color/'+k)}">${l}</span>`).join('')}</div>
 <div class="dgrp" style="margin-top:18px;align-items:stretch"><div style="padding:24px;border-radius:${rd['radius-lg']}px;background:${c('bg/surface')};border:1px solid ${c('border/subtle')};box-shadow:${M.shadows[mode]['card (ui-shadow-card)']};min-width:240px"><div style="color:${c('text/secondary')};font-size:14px">${dir==='rtl'?'بطاقة / KPI':'Card / KPI'}</div><div style="font:800 40px ${dispFont(mode)};font-variant-numeric:lining-nums">1,284</div></div>
 <div style="width:252px;padding:18px 12px;border-radius:16px;background:${(()=>{const s=M.sidebar_bg[mode];return s.type==='gradient'?`linear-gradient(${s.top},${s.bottom})`:s.color})()};color:${c('sidebar/text')}"><div style="padding:10px 12px;border-radius:12px">${dir==='rtl'?'رابط':'Sidebar link'}</div><div style="padding:10px 12px;border-radius:12px;background:${c('sidebar/tint')};color:${c('sidebar/gold-soft')};font-weight:700">${dir==='rtl'?'رابط نشط':'Active link'}</div></div></div></div>`}
function bindComps(){$$('[data-dir]').forEach(b=>b.onclick=()=>{ST.dir=b.dataset.dir;render()});$('#disT').onclick=()=>{ST.dis=!ST.dis;render()}}

/* ---------- Specs ---------- */
const KEYS=['height_px','padding_T/R/B/L','radius_px','border_px','border_color','font','font_size_px','weight','line_height','text_color','fill','shadow','text_transform'];
function specsView(){const names=[...new Set(M.comps.map(r=>r.component))];
 const rows=M.comps.filter(r=>(ST.compare||r.mode===mode)&&(ST.cfilter==='all'||r.component.startsWith(ST.cfilter))&&match(r.component));
 const fam=[...new Set(names.map(n=>n.split('/')[0]))];
 let h=`<h2>Component specs ${ST.compare?'— كل الأوضاع':'— '+M.mode_label[mode]}</h2><p class="sub">height = ارتفاع فعلي مقاس · padding أعلى/يمين/أسفل/يسار. في وضع المقارنة الخلايا اللي بتختلف عن Classic بتتلوّن. دوس على الصف يتنسخ JSON.</p>
 <div class="bar"><button class="chip ${ST.compare?'on':''}" id="sc">قارن الأوضاع</button><select class="sel" id="sf"><option value="all">كل الـ components</option>${fam.map(f=>`<option ${ST.cfilter===f?'selected':''}>${f}</option>`).join('')}</select><button class="btn" id="scsv">نسخ CSV (${rows.length})</button></div>`;
 if(!rows.length)return h+'<div class="empty">مفيش نتائج.</div>';
 const base={};M.comps.filter(r=>r.mode==='classic').forEach(r=>base[r.component]=r);
 h+=`<div class="scroll"><table class="tbl"><thead><tr><th>Component</th>${ST.compare?'<th>mode</th>':''}<th>width</th>${KEYS.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>`+rows.map((r,i)=>`<tr data-row="${i}" style="cursor:pointer"><td><strong>${r.component}</strong></td>${ST.compare?`<td class="mono">${r.mode}</td>`:''}<td class="mono">${r.width}</td>${KEYS.map(k=>{const d=ST.compare&&r.mode!=='classic'&&base[r.component]&&String(base[r.component][k])!==String(r[k]);return `<td class="mono ${d?'d':''}">${r[k]===''?'—':r[k]}</td>`}).join('')}</tr>`).join('')+'</tbody></table></div>';
 ST._rows=rows;return h}
function bindSpecs(){$('#sc').onclick=()=>{ST.compare=!ST.compare;render()};$('#sf').onchange=e=>{ST.cfilter=e.target.value;render()};
 $$('[data-row]').forEach(tr=>tr.onclick=()=>copy(JSON.stringify(ST._rows[+tr.dataset.row],null,1),'row JSON'));
$('#scsv').onclick=()=>{const cols=['component','mode','width',...KEYS];copy(cols.join(',')+'\n'+ST._rows.map(r=>cols.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'CSV')}}

/* ---------- Icons ---------- */
function iconsView(){const names=Object.keys(ICONS).filter(n=>match(n));const sz=ST.isz||24;
 let h=`<h2>الأيقونات (${Object.keys(ICONS).length})</h2><p class="sub">دوس على أيقونة: بيتنسخ الـ SVG. Shift+click بينسخ الاسم بس. اللون بياخد currentColor.</p><div class="bar"><label class="mono">size ${sz}px</label><input type="range" id="isz" min="16" max="64" step="4" value="${sz}"><button class="btn" id="iall">نسخ كل الأيقونات (SVG sheet)</button><span class="mono" style="color:var(--muted)">${names.length} نتيجة</span></div>`;
 if(!names.length)return h+'<div class="empty">مفيش أيقونة بالاسم ده.</div>';
 return h+'<div class="icons">'+names.map(n=>`<button class="ic" data-ic="${n}"><svg width="${sz}" height="${sz}" viewBox="0 0 24 24">${ICONS[n]}</svg><span>${n}</span></button>`).join('')+'</div>'}
const svgOf=n=>`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
function bindIcons(){$$('[data-ic]').forEach(b=>b.onclick=e=>copy(e.shiftKey?b.dataset.ic:svgOf(b.dataset.ic),b.dataset.ic));$('#isz').oninput=e=>{ST.isz=+e.target.value;$$('.ic svg').forEach(s=>{s.setAttribute('width',ST.isz);s.setAttribute('height',ST.isz)});document.querySelector('label.mono').textContent='size '+ST.isz+'px'};
 $('#iall').onclick=()=>copy('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+Object.entries(ICONS).map(([n,i])=>`<g id="${n}">${i}</g>`).join('')+'</svg>','icons sheet')}

/* ---------- Export ---------- */
function exportView(){return `<h2>تصدير (${M.mode_label[mode]})</h2><p class="sub">صدّر الـ tokens للوضع الحالي. غيّر الوضع من فوق لتصدير غيره.</p>
 <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${[['css','CSS variables','--uip-… : value ;'],['json','JSON','{ token: hex }'],['csv','Colors CSV','figma_name, token, hex, css'],['all','JSON كامل (كل الأوضاع)','للاستيراد في أدوات تانية']].map(([k,t,d])=>`<div class="box"><strong>${t}</strong><div class="mono" style="color:var(--muted);margin:4px 0 12px">${d}</div><button class="btn pri" data-ex="${k}|c">نسخ</button></div>`).join('')}</div>
 <h3>Preview — CSS</h3><pre class="box mono" style="max-height:320px;overflow:auto;white-space:pre">${esc(exp('css'))}</pre>`}
function exp(k){const rows=M.color_rows.filter(r=>r[mode+'_hex']);
 if(k==='css')return`:root{\n`+rows.map(r=>`  ${r.token}: ${r[mode+'_hex']};`).join('\n')+'\n}';
 if(k==='json')return JSON.stringify(Object.fromEntries(rows.map(r=>[r.token,r[mode+'_hex']])),null,2);
 if(k==='csv')return'figma_name,token,hex,css\n'+rows.map(r=>[r.figma_name,r.token,r[mode+'_hex'],'"'+r[mode+'_css']+'"'].join(',')).join('\n');
 return JSON.stringify({colors:M.color_rows,radius:M.radius,shadows:M.shadows,spacing:M.spacing,type:M.type_rows,components:M.comps},null,1)}
function bindExport(){$$('[data-ex]').forEach(b=>b.onclick=()=>{const[k,a]=b.dataset.ex.split('|');const t=exp(k);copy(t,k+' ('+t.length+' chars)')})}

/* ---------- Render ---------- */
const VIEWS={screens:[screensView,bindScreens],colors:[colorsView,bindColors],type:[typeView,bindType],space:[spaceView,bindCp],comps:[compsView,bindComps],specs:[specsView,bindSpecs],icons:[iconsView,bindIcons],export:[exportView,bindExport]};
function render(){if(!VIEWS[sec])sec='screens';applyTheme();const y=scrollY;$('#main').innerHTML=VIEWS[sec][0]();VIEWS[sec][1]();scrollTo(0,y)}
$('#q').oninput=e=>{if(!M)return;q=e.target.value.trim().toLowerCase();const a=document.activeElement;render();$('#q').focus()};
$('#themeBtn').onclick=()=>{if(!M)return;mode=mode.startsWith('dark')?(mode==='dark-classic'?'classic':'light'):(mode==='classic'?'dark-classic':'dark-light');store.set('uipe-sg-mode',mode);render()};
addEventListener('hashchange',()=>{sec=(location.hash||'#screens').slice(1);if(M)render()});
fetch('data.json').then(r=>r.json()).then(d=>{M=d.M;ICONS=d.icons;SCREENS=d.screens;MODES=Object.keys(M.mode_label);if(!MODES.includes(mode))mode='classic';render()}).catch(()=>{$('#main').innerHTML='<div class="empty">تعذر تحميل البيانات.</div>'});
</script>

</body></html>
